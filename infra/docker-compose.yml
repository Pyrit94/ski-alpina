services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ski
      POSTGRES_PASSWORD: ski
      POSTGRES_DB: ski
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/001.sql:ro
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ski"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    expose:
      - "6379"
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    command: ["node", "--experimental-strip-types", "apps/api/src/index.ts"]
    environment:
      DATABASE_URL: postgres://ski:ski@postgres:5432/ski
      REDIS_URL: redis://redis:6379
      API_PORT: "8787"
      PORT: "8787"
      DOCKER_PREVIEW: "1"
    expose:
      - "8787"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  sim:
    build:
      context: ..
      dockerfile: Dockerfile
    command: ["node", "--experimental-strip-types", "apps/sim/src/index.ts"]
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      - redis
      - api
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      PORT: "8080"
      DOCKER_PREVIEW: "1"
    expose:
      - "8080"
    depends_on:
      - api
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "${PORT:-8080}:8080"
    depends_on:
      - web
      - api
    restart: unless-stopped

volumes:
  pgdata:
