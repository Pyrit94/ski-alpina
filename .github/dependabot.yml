version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: UTC
    open-pull-requests-limit: 5
    groups:
      npm-klein:
        update-types: [minor, patch]
    ignore:
      # better-auth 1.7 ersetzt die OAuth2-Endpunkte des genericOAuth-Plugins
      # (signIn.oauth2, /oauth2/callback/:id) durch signIn.social und
      # /callback/:id. Das ist eine Login-Migration samt neuer Redirect-URI bei
      # Google, also von Hand. Patches von 1.6.x laufen weiter mit.
      - dependency-name: better-auth
        update-types: [version-update:semver-minor, version-update:semver-major]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: UTC
    ignore:
      # Node-Hauptversion von Hand (siehe Doku "Updates").
      - dependency-name: node
        update-types: [version-update:semver-major]
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: UTC
    ignore:
      - dependency-name: postgres
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: UTC
